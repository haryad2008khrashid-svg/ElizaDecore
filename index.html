<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموونەی کارەکان بەشی 2 | Eliza Decor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Noto Kufi Arabic', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #050508; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 25px 15px; position: relative; overflow-x: hidden; }
        
        /* Background styles (same as yours) */
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(3px 3px at 20px 30px, #ffffff, rgba(0,0,0,0)), radial-gradient(4px 4px at 80px 120px, #e60023, rgba(0,0,0,0)); background-size: 350px 350px; opacity: 0.95; z-index: -2; animation: galaxyTwinkle 12s infinite linear; }
        body::after { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 20%, rgba(230, 0, 35, 0.2) 0%, rgba(5, 5, 8, 0.85) 75%); z-index: -1; }
        @keyframes galaxyTwinkle { 0% { transform: translateY(0); } 100% { transform: translateY(-350px); } }

        .container { width: 100%; max-width: 520px; text-align: center; display: flex; flex-direction: column; align-items: center; z-index: 1; }
        .logo-box { width: 100px; height: 100px; margin-bottom: 12px; border-radius: 50%; padding: 3px; background: linear-gradient(135deg, #e60023, #111, #ffffff); box-shadow: 0 0 25px rgba(230, 0, 35, 0.4); }
        .logo-img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; background-color: #000; }
        
        .back-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px 20px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(230, 0, 35, 0.4); border-radius: 16px; color: #ffffff; text-decoration: none; font-weight: 600; margin-bottom: 25px; transition: 0.2s; }
        .back-btn:hover { background: rgba(230, 0, 35, 0.15); border-color: rgba(230, 0, 35, 0.8); }

        .showcase-wrapper { position: relative; width: 100%; display: flex; align-items: center; }
        .showcase-scroll-container { width: 100%; display: flex; gap: 14px; overflow-x: auto; padding-bottom: 15px; scroll-behavior: smooth; }
        .media-card { min-width: 240px; height: 320px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 16px; overflow: hidden; flex-shrink: 0; }
        .media-card img { width: 100%; height: 100%; object-fit: cover; }
        
        .scroll-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.85); color: #fff; border: 1px solid #e60023; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 10; }
        .scroll-right { right: -12px; } .scroll-left { left: -12px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-box"><img src="logo.png" alt="Logo" class="logo-img"></div>
        <h1>ELIZA <span>DECOR</span></h1>
        
        <!-- لێرە گۆڕانکارییەکە کراوە -->
        <a href="https://haryad2008khrashid-svg.github.io/ElizaDecore/" class="back-btn">
            <i class="fa-solid fa-arrow-right"></i>
            <span>گەڕانەوە بۆ پەڕەی سەرەکی</span>
        </a>

        <div class="showcase-wrapper">
            <button class="scroll-arrow scroll-right" onclick="scrollGallery(260)"><i class="fa-solid fa-chevron-right"></i></button>
            <div class="showcase-scroll-container" id="galleryContainer">
                <script>
                    for (let i = 28; i <= 57; i++) {
                        document.write(`<div class="media-card"><img src="${i}.jpg" alt="Work ${i}" loading="lazy"></div>`);
                    }
                </script>
            </div>
            <button class="scroll-arrow scroll-left" onclick="scrollGallery(-260)"><i class="fa-solid fa-chevron-left"></i></button>
        </div>
    </div>

    <script>
        function scrollGallery(amount) {
            document.getElementById('galleryContainer').scrollBy({ left: amount, behavior: 'smooth' });
        }
    </script>
</body>
</html>
